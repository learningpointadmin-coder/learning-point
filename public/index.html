<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Learning Point competitive exam preparation platform." />
  <title>Learning Point — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background:
        radial-gradient(circle at 15% 20%, rgba(34, 197, 94, 0.18), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.2), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.16), transparent 28%),
        #07111f;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(760px, 100%);
      padding: 48px 28px;
      text-align: center;
      border: 1px solid #273449;
      border-radius: 24px;
      background: rgba(17, 29, 49, 0.94);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 20px;
      color: white;
      font-size: 25px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #22c55e);
    }

    .status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(34, 197, 94, 0.32);
      border-radius: 999px;
      color: #86efac;
      background: rgba(34, 197, 94, 0.1);
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.05;
    }

    h1 span {
      color: #60a5fa;
    }

    p {
      max-width: 580px;
      margin: 20px auto 0;
      color: #aab6ca;
      font-size: 17px;
      line-height: 1.7;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .features span {
      padding: 9px 13px;
      border: 1px solid #273449;
      border-radius: 10px;
      color: #cbd5e1;
      background: #0b1628;
      font-size: 14px;
    }

    footer {
      margin-top: 34px;
      color: #728199;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">LP</div>

    <div class="status">Website setup in progress</div>

    <h1>Learning <span>Point</span></h1>

    <p>
      A professional competitive-exam preparation platform with
      exam-oriented mock tests, detailed explanations and smart learning tools.
    </p>

    <div class="features">
      <span>Mock Tests</span>
      <span>Detailed Explanations</span>
      <span>Hindi + English</span>
      <span>Mobile Friendly</span>
    </div>

    <footer>
      © 2026 Learning Point. All rights reserved.
    </footer>
  </main>
</body>
</html>
